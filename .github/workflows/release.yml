name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5

    publish:
        needs: release
        if: ${{ needs.release.outputs.created == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.release.outputs.tag }}
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: bun install --frozen-lockfile
            - run: bun run check
            - name: Publish npm package
              run: npm publish --access public --provenance
            - name: Build release binaries
              run: |
                  mkdir -p dist release
                  bun build src/main.ts --compile --target=bun-darwin-arm64 --outfile=dist/project
                  tar -C dist -czf release/project-darwin-arm64.tar.gz project
                  bun build src/main.ts --compile --target=bun-darwin-x64 --outfile=dist/project
                  tar -C dist -czf release/project-darwin-x64.tar.gz project
                  bun build src/main.ts --compile --target=bun-linux-arm64 --outfile=dist/project
                  tar -C dist -czf release/project-linux-arm64.tar.gz project
                  bun build src/main.ts --compile --target=bun-linux-x64-baseline --outfile=dist/project
                  tar -C dist -czf release/project-linux-x64.tar.gz project
                  bun build src/main.ts --compile --target=bun-windows-x64-baseline --outfile=dist/project.exe
                  zip -j release/project-windows-x64.zip dist/project.exe
                  cd release
                  sha256sum * > SHA256SUMS
            - name: Upload GitHub release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ needs.release.outputs.tag }}" release/*
